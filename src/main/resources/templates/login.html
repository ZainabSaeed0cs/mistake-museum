
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Mistake Museum</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: grid; place-items: center;
            padding: 24px; background: #F7F3EA;
            color: #25232B; font-family: Arial, sans-serif;
        }
        .card {
            width: 100%; max-width: 430px;
            background: white; padding: 38px;
            border: 1px solid #e9e3da; border-radius: 24px;
            box-shadow: 0 12px 40px #25232b12;
        }
        .logo { font-size: 23px; font-weight: 800; }
        .logo span { color: #9479dc; }
        .tag {
            display: inline-block; margin-top: 28px;
            background: #eee8ff; color: #7055b5;
            padding: 7px 12px; border-radius: 20px;
            font-size: 12px; font-weight: bold;
        }
        h1 { font-size: 30px; margin: 16px 0 8px; }
        .sub { color: #77727e; line-height: 1.5; margin-bottom: 25px; }
        label { display: block; font-size: 13px; font-weight: bold; margin: 17px 0 8px; }
        input {
            width: 100%; padding: 13px 14px;
            border: 1px solid #ded9e2; border-radius: 11px;
            font-size: 14px; outline: none;
        }
        input:focus { border-color: #a891e8; box-shadow: 0 0 0 3px #b9a6f533; }
        button {
            width: 100%; margin-top: 24px; padding: 14px;
            border: 0; border-radius: 11px;
            background: #25232B; color: white;
            font-size: 15px; font-weight: bold; cursor: pointer;
        }
        button:hover { background: #51466b; }
        .message { padding: 11px; border-radius: 9px; font-size: 13px; }
        .error { background: #ffe9e9; color: #a33; }
        .success { background: #e8f5e9; color: #286b35; }
        .footer { text-align: center; margin-top: 22px; color: #77727e; font-size: 13px; }
        a { color: #8065c4; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">mistake<span>museum.</span></div>
    <div class="tag">WELCOME BACK ✦</div>
    <h1>Good to see you again.</h1>
    <p class="sub">Your mistakes have stories. Let's pick up where you left off.</p>

    <p class="message error" th:if="${param.error}">Incorrect email or password. Try again.</p>
    <p class="message success" th:if="${success}" th:text="${success}"></p>
    <p class="message error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/login}" method="post">
        <label for="email">Email address</label>
        <input id="email" type="email" name="username" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Your password" required>

        <button type="submit">Log in →</button>
    </form>

    <div class="footer">
        New here? <a th:href="@{/register}">Create an account</a>
    </div>
</div>
</body>
</html>
